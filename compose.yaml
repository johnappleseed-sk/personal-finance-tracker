services:
  postgres:
    image: postgres:18
    container_name: personal-finance-postgres

    environment:
      POSTGRES_DB: ${DB_NAME:-personal_finance}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env or the environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or the environment}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
