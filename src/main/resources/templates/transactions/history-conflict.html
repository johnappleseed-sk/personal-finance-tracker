<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('History protected')}"></head>
<body>
<main class="workspace" aria-labelledby="page-title">
    <p class="brand">Personal Finance Tracker</p>
    <nav th:replace="~{fragments/navigation :: navigation('transactions')}"></nav>
    <section class="form-panel">
        <h1 id="page-title">Your transaction history is protected</h1>
        <p class="alert" role="alert" th:text="${message}">This change would affect existing transactions.</p>
        <div class="form-actions">
            <a th:href="@{/accounts}">Back to your accounts</a>
            <a th:href="@{/categories}">Back to your categories</a>
        </div>
    </section>
</main>
</body>
</html>
