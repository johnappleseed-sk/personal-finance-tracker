<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Home')}"></head>
<body>
<main class="auth-card" aria-labelledby="page-title">
    <p class="brand">Personal Finance Tracker</p>
    <nav th:replace="~{fragments/navigation :: navigation('home')}"></nav>
    <h1 id="page-title">Welcome, <span th:text="${displayName}">User</span></h1>
    <p>You are signed in securely.</p>
    <section aria-labelledby="next-title">
        <h2 id="next-title">Your finance workspace</h2>
        <a th:href="@{/accounts}">Manage your accounts</a>
        <a th:href="@{/categories}">Manage your categories</a>
        <a th:href="@{/transactions}">Manage your transactions</a>
        <p>Account balances are available on the Accounts page. Dashboards and reports are not available yet.</p>
    </section>
</main>
</body>
</html>
