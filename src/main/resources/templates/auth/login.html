<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign in')}"></head>
<body>
<main class="auth-card" aria-labelledby="page-title">
    <div class="card-top" style="align-items: center;">
        <p class="brand" style="margin: 0;">Personal Finance Tracker</p>
        <button id="theme-toggle" type="button" class="btn-theme" aria-label="Switch theme">☾ Dark</button>
    </div>
    <h1 id="page-title">Sign in</h1>
    <p class="hint" style="margin-bottom: 1.25rem;">Use the email address and password you registered with.</p>
    <div class="alert" role="alert" th:if="${param.error != null}">
        Invalid email or password. Please try again.
    </div>
    <div class="notice" role="status" th:if="${param.logout != null}">
        You have been signed out.
    </div>
    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="username" inputmode="email"
                   placeholder="you@example.com" required maxlength="254">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="Enter your password" required maxlength="72">
        </div>
        <button type="submit">Sign in</button>
    </form>
    <p class="hint" style="margin-top: 1.25rem; text-align: center;">
        New here? <a th:href="@{/register}">Create an account</a>
    </p>
</main>
</body>
</html>
