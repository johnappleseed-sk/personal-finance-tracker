spring.application.name=personal-finance

# Compose reads .env automatically; this import lets Spring use the same file.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema changes belong to migrations, not Hibernate's automatic DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Refuse unexpected existing schemas and edits to applied migrations.
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

server.error.include-message=never
server.error.include-stacktrace=never

# Keep session identifiers out of URLs; enable secure cookies behind production HTTPS.
server.servlet.session.timeout=20m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
